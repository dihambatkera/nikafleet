# render.yaml – NikaFleet deployment configuration
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: nikafleet
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free          # change to "starter" / "standard" for production
    region: singapore   # closest to Malaysia
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: NikaFleet
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true   # Render auto-generates a secret
      - key: APP_URL
        value: https://nikafleet.onrender.com   # update once you know the URL

      # ── Database (use Render's MySQL add-on or external DB) ──
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromDatabase:
          name: nikafleet-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: nikafleet-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: nikafleet-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: nikafleet-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: nikafleet-db
          property: password

      # ── Cache / Queue ──
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: SESSION_DRIVER
        value: database

      # ── Filesystem ──
      - key: FILESYSTEM_DISK
        value: public

      # ── Company info ──
      - key: COMPANY_PHONE
        value: "+60 11-6824 7599"
      - key: COMPANY_WHATSAPP
        value: "601168247599"
      - key: COMPANY_LOCATION
        value: "Rawang, Selangor"
      - key: COMPANY_TIKTOK
        value: "https://www.tiktok.com/@nika.fleet"

databases:
  - name: nikafleet-db
    databaseName: nikafleet
    user: nikafleet
    plan: free   # Render free MySQL (90-day TTL) – upgrade for production