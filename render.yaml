# render.yaml – NikaFleet deployment configuration
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: nikafleet
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free          # change to "starter" / "standard" for production
    region: singapore   # closest to Malaysia
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: NikaFleet
      - key: APP_ENV
        value: local          # ⚠️ DEBUG ONLY – change back to production when done
      - key: APP_DEBUG
        value: true           # ⚠️ DEBUG ONLY – change back to false when done
      - key: APP_KEY
        generateValue: true   # Render auto-generates a secret
      - key: APP_URL
        value: https://nikafleet.onrender.com   # update to your actual Render URL

      # ── Database (Render native PostgreSQL) ──────────────────────────────
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: nikafleet-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: nikafleet-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: nikafleet-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: nikafleet-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: nikafleet-db
          property: password

      # ── Session & Cache ───────────────────────────────────────────────────
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: database

      # ── Filesystem ────────────────────────────────────────────────────────
      - key: FILESYSTEM_DISK
        value: public

      # ── Logging ───────────────────────────────────────────────────────────
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: debug

      # ── Company info ──────────────────────────────────────────────────────
      - key: COMPANY_PHONE
        value: "+60 11-6824 7599"
      - key: COMPANY_WHATSAPP
        value: "601168247599"
      - key: COMPANY_LOCATION
        value: "Rawang, Selangor"
      - key: COMPANY_TIKTOK
        value: "https://www.tiktok.com/@nika.fleet"

databases:
  - name: nikafleet-db
    databaseName: nikafleet
    user: nikafleet
    plan: free   # Render free PostgreSQL – upgrade to paid for production